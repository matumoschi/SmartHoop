<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SmartHoop Tracker</title>

    <!-- MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(0, 255, 136, 0.3) 0%, transparent 40%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 217, 255, 0.3) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 200, 200, 0.2) 0%, transparent 50%),
                linear-gradient(180deg,
                    #0a1628 0%,
                    #0d2a4f 15%,
                    #1a5f4a 30%,
                    #0a4f5f 40%,
                    #1a3a5f 50%,
                    #0d2438 70%,
                    #050a1a 100%);
            background-size: 200% 200%, 200% 200%, 150% 150%, 100% 100%;
            animation: auroraBoreal 12s ease infinite;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse 800px 200px at 30% 20%, rgba(0, 255, 150, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse 900px 250px at 70% 15%, rgba(0, 180, 255, 0.15) 0%, transparent 50%);
            animation: auroraGlow 10s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes auroraBoreal {
            0% { background-position: 0% 50%, 0% 50%, 0% 50%, 0% 0%; }
            25% { background-position: 50% 50%, 100% 50%, 50% 50%, 0% 0%; }
            50% { background-position: 100% 50%, 50% 50%, 100% 50%, 0% 0%; }
            75% { background-position: 50% 50%, 0% 50%, 50% 50%, 0% 0%; }
            100% { background-position: 0% 50%, 0% 50%, 0% 50%, 0% 0%; }
        }

        @keyframes auroraGlow {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: transparent;
            padding: 30px;
            position: relative;
            z-index: 1;
        }

        @font-face {
            font-family: 'Angels';
            src: url('https://cdn.jsdelivr.net/gh/matumoschi/SmartHoop@main/Angels.woff') format('woff');
            font-weight: 900;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 3.8em;
            background: linear-gradient(45deg, #ff6b35, #ffa500, #ff1744);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 900;
            font-family: 'Angels', 'Impact', sans-serif;
            text-shadow:
                3px 3px 0px rgba(0, 0, 0, 0.5),
                -2px -2px 0px rgba(255, 107, 53, 0.3),
                0 0 30px rgba(255, 107, 53, 0.6);
            animation: titleGlow 2s ease-in-out infinite, titleBounce 2.5s ease-in-out infinite;
            -webkit-text-stroke: 1px rgba(0, 0, 0, 0.2);
        }

        @keyframes titleBounce {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        @keyframes titleGlow {
            0%, 100% {
                text-shadow: 0 0 20px rgba(255, 107, 53, 0.5), 0 0 40px rgba(255, 165, 0, 0.3);
            }
            50% {
                text-shadow: 0 0 30px rgba(255, 107, 53, 0.8), 0 0 60px rgba(255, 165, 0, 0.6);
            }
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 30px;
            align-items: center;
            justify-items: center;
        }

        .stats-section {
            background: transparent;
            padding: 25px;
        }

        .stat-box {
            background: rgba(255, 107, 53, 0.25);
            border-left: 4px solid #ff6b35;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            color: #ffa500;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #ff6b35;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            padding: 15px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-start {
            background: linear-gradient(135deg, #00d084, #00a86b);
            color: white;
        }

        .btn-stop {
            background: linear-gradient(135deg, #ff6b6b, #ff0000);
            color: white;
        }

        .btn-reset {
            background: linear-gradient(135deg, #4a4a4a, #2a2a2a);
            color: #ffa500;
            border: 2px solid #ffa500;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .board-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .board-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 255, 255, 0.3);
            position: relative;
        }

        svg {
            filter: drop-shadow(0 0 10px rgba(255, 107, 53, 0.3));
            display: block;
        }

        .sector {
            cursor: pointer;
            transition: fill 140ms ease, transform 140ms ease;
        }

        .sector.hit {
            fill: rgba(0, 100, 255, 0.35) !important;
            transform: scale(1.01);
            filter: drop-shadow(0 0 18px rgba(0, 120, 255, 0.8));
        }

        .counter-info {
            display: none;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }
        }

        /* MQTT status bubble */
        .mqtt-status {
            position: fixed;
            right: 18px;
            bottom: 18px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 10px 14px;
            border-radius: 10px;
            border: 2px solid rgba(255,107,53,0.9);
            font-weight: bold;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SmartHoop Tracker</h1>

        <div class="content">
            <!-- Sección de Estadísticas -->
            <div class="stats-section">
                <div class="stat-box">
                    <div class="stat-label">Tiros Realizados</div>
                    <div class="stat-value" id="shots">0</div>
                </div>

                <div class="stat-box">
                    <div class="stat-label">Anotaciones</div>
                    <div class="stat-value" id="scores">0</div>
                </div>

                <div class="stat-box">
                    <div class="stat-label">% de Anotación</div>
                    <div class="stat-value" id="percentage">0%</div>
                </div>

                <div class="controls">
                    <button class="btn-start" id="startBtn" onclick="startTraining()">Iniciar</button>
                    <button class="btn-stop" id="stopBtn" onclick="stopTraining()" disabled>Parar</button>
                    <button class="btn-reset" id="resetBtn" onclick="resetStats()">Reiniciar</button>
                </div>

                <button class="btn-fallo" id="falloBtn" onclick="recordMiss()" style="width: 100%; margin-top: 15px; background: linear-gradient(135deg, #ff8c00, #ff6347); color: white; border: none;">Fallo</button>
            </div>

            <!-- Sección del Tablero -->
            <div class="board-section">
                <div class="board-container">
                    <svg width="700" height="320" viewBox="0 0 700 320" id="boardSvg">
                        <!-- Marco exterior gris (sombra) -->
                        <rect x="25" y="20" width="650" height="280" fill="#333" rx="8"/>

                        <!-- Tablero blanco principal -->
                        <rect x="40" y="30" width="620" height="260" fill="#ffffff" stroke="#000" stroke-width="3" rx="8"/>

                        <!-- Efecto de profundidad (lado derecho) -->
                        <rect x="640" y="30" width="15" height="260" fill="#e0e0e0" rx="8"/>

                        <!-- Rectángulo del aro (área de la canasta) con bordes redondeados -->
                        <rect x="270" y="80" width="160" height="120" fill="none" stroke="#000" stroke-width="3" rx="12"/>

                        <!-- Varilla del aro (color rojo) -->
                        <rect x="340" y="200" width="20" height="40" fill="#cc0000" stroke="#000" stroke-width="1"/>

                        <!-- Aro (círculo rojo) -->
                        <circle cx="350" cy="210" r="18" fill="none" stroke="#cc0000" stroke-width="4"/>

                        <!-- Red del aro (malla) -->
                        <path d="M 332 228 L 325 280 M 350 228 L 350 290 M 368 228 L 375 280" stroke="#999" stroke-width="2" stroke-linecap="round"/>
                        <line x1="325" y1="250" x2="375" y2="250" stroke="#999" stroke-width="1.5"/>
                        <line x1="322" y1="265" x2="378" y2="265" stroke="#999" stroke-width="1.5"/>
                        <line x1="320" y1="280" x2="380" y2="280" stroke="#999" stroke-width="1.5"/>

                        <!-- Línea central vertical del tablero -->
                        <line x1="350" y1="30" x2="350" y2="290" stroke="#000" stroke-width="2" opacity="0.3"/>

                        <!-- Línea central horizontal -->
                        <line x1="40" y1="160" x2="660" y2="160" stroke="#000" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.4"/>

                        <!-- Sectores clickeables -->
                        <!-- Superior Izquierdo -->
                        <rect x="40" y="30" width="310" height="130" class="sector" id="sector0"
                              fill="rgba(100, 150, 255, 0.08)" stroke="none"
                              onclick="userRecordShot(0)"/>
                        <text x="145" y="105" text-anchor="middle" font-size="14" fill="#000" pointer-events="none" font-weight="bold">
                            <tspan x="145" dy="0">SUP IZQ</tspan>
                            <tspan x="145" dy="18" id="count0" font-size="16">(0)</tspan>
                        </text>

                        <!-- Superior Derecho -->
                        <rect x="350" y="30" width="310" height="130" class="sector" id="sector1"
                              fill="rgba(100, 150, 255, 0.08)" stroke="none"
                              onclick="userRecordShot(1)"/>
                        <text x="555" y="105" text-anchor="middle" font-size="14" fill="#000" pointer-events="none" font-weight="bold">
                            <tspan x="555" dy="0">SUP DER</tspan>
                            <tspan x="555" dy="18" id="count1" font-size="16">(0)</tspan>
                        </text>

                        <!-- Inferior Izquierdo -->
                        <rect x="40" y="160" width="310" height="130" class="sector" id="sector2"
                              fill="rgba(100, 150, 255, 0.08)" stroke="none"
                              onclick="userRecordShot(2)"/>
                        <text x="145" y="235" text-anchor="middle" font-size="14" fill="#000" pointer-events="none" font-weight="bold">
                            <tspan x="145" dy="0">INF IZQ</tspan>
                            <tspan x="145" dy="18" id="count2" font-size="16">(0)</tspan>
                        </text>

                        <!-- Inferior Derecho -->
                        <rect x="350" y="160" width="310" height="130" class="sector" id="sector3"
                              fill="rgba(100, 150, 255, 0.08)" stroke="none"
                              onclick="userRecordShot(3)"/>
                        <text x="555" y="235" text-anchor="middle" font-size="14" fill="#000" pointer-events="none" font-weight="bold">
                            <tspan x="555" dy="0">INF DER</tspan>
                            <tspan x="555" dy="18" id="count3" font-size="16">(0)</tspan>
                        </text>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <!-- MQTT status bubble -->
    <div class="mqtt-status" id="mqttStatus">🔴 MQTT: desconectado</div>

    <script>
        // === Configuración MQTT ===
        const BROKER_WS = "ws://18.235.12.123:9001"; // ya configurado para tu EC2
        const TOPIC_DATOS = "datos/entrenamiento";   // recibe JSON: {acertados, errados, sectores:[...]}
        const TOPIC_CONTROL = "control/entrenamiento"; // publica comandos: "start","stop","reset"

        // Estado local (UI)
        const state = {
            shots: 0,
            scores: 0,
            sectors: [0,0,0,0],
            isTraining: false
        };

        // Inicializa cliente MQTT
        let client;
        function connectMQTT() {
            // opciones: reconexión automática
            client = mqtt.connect(BROKER_WS, { reconnectPeriod: 2000 });

            client.on('connect', () => {
                console.log('MQTT conectado');
                document.getElementById('mqttStatus').textContent = '🟢 MQTT: conectado';
                document.getElementById('mqttStatus').style.borderColor = '#4CAF50';
                client.subscribe(TOPIC_DATOS, { qos: 0 }, (err) => {
                    if (err) console.warn('Suscripción fallida', err);
                });
            });

            client.on('reconnect', () => {
                console.log('MQTT reconectando...');
                document.getElementById('mqttStatus').textContent = '🟡 MQTT: reconectando';
                document.getElementById('mqttStatus').style.borderColor = '#f0ad4e';
            });

            client.on('error', (err) => {
                console.error('MQTT error', err);
                document.getElementById('mqttStatus').textContent = '🔴 MQTT: error';
                document.getElementById('mqttStatus').style.borderColor = '#ff4444';
            });

            client.on('offline', () => {
                console.log('MQTT offline');
                document.getElementById('mqttStatus').textContent = '🔴 MQTT: desconectado';
                document.getElementById('mqttStatus').style.borderColor = '#ff4444';
            });

            client.on('message', (topic, payload) => {
                try {
                    const msg = payload.toString();
                    // asumimos JSON en TOPIC_DATOS
                    if (topic === TOPIC_DATOS) {
                        const data = JSON.parse(msg);
                        handleIncomingData(data);
                    }
                } catch (e) {
                    console.error("Error parseando mensaje MQTT:", e);
                }
            });
        }

        // Manejo de datos entrantes (desde ESP32)
        function handleIncomingData(data) {
            // data expected: {acertados: int, errados: int, sectores: [int,int,int,int]}
            const acertados = Number(data.acertados) || 0;
            const errados = Number(data.errados) || 0;
            const sectores = Array.isArray(data.sectores) ? data.sectores.map(n => Number(n)||0) : [0,0,0,0];

            state.scores = acertados;
            state.shots = acertados + errados;
            state.sectors = sectores;

            // update UI
            updateStatsUI();

            // animate each sector that increased:
            for (let i = 0; i < 4; i++) {
                const countText = document.getElementById(`count${i}`);
                if (countText) countText.textContent = `(${state.sectors[i]})`;
            }

            // flash sectors that changed recently:
            flashUpdatedSectors(sectores);
        }

        // Flash sectors when ESP32 reports hits (brief highlight)
        let lastSectorsSnapshot = [0,0,0,0];
        function flashUpdatedSectors(newSectors) {
            for (let i = 0; i < 4; i++) {
                if (newSectors[i] > lastSectorsSnapshot[i]) {
                    const el = document.getElementById(`sector${i}`);
                    if (el) {
                        el.classList.add('hit');
                        setTimeout(() => el.classList.remove('hit'), 350);
                    }
                }
            }
            lastSectorsSnapshot = newSectors.slice();
        }

        // Actualiza las cifras visibles
        function updateStatsUI() {
            document.getElementById('shots').textContent = state.shots;
            document.getElementById('scores').textContent = state.scores;
            const perc = state.shots > 0 ? Math.round((state.scores / state.shots) * 100) : 0;
            document.getElementById('percentage').textContent = perc + '%';
            for (let i = 0; i < 4; i++) {
                const el = document.getElementById(`count${i}`);
                if (el) el.textContent = `(${state.sectors[i]})`;
            }
        }

        // Envío de comandos desde UI al ESP32
        function publishControl(cmd) {
            if (client && client.connected) {
                client.publish(TOPIC_CONTROL, cmd);
                console.log('Publicado control:', cmd);
            } else {
                console.warn('No conectado: no se puede publicar', cmd);
            }
        }

        // Botones y acciones locales
        function startTraining() {
            state.isTraining = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            publishControl('start');
        }

        function stopTraining() {
            state.isTraining = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            publishControl('stop');
        }

        function resetStats() {
            // reset UI and local state
            state.shots = 0;
            state.scores = 0;
            state.sectors = [0,0,0,0];
            state.isTraining = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            updateStatsUI();
            // inform ESP32 to reset its counters
            publishControl('reset');
        }

        // Usuario hace click manual en tablero (simulación + opcional)
        function userRecordShot(sectorId) {
            // if training is inactive, ignore user clicks
            if (!state.isTraining) return;

            // local simulation: increment counters and animate
            state.shots++;
            // probabilistic hit (same logic original)
            if (Math.random() < 0.6) state.scores++;
            state.sectors[sectorId] = (state.sectors[sectorId] || 0) + 1;
            updateStatsUI();

            const el = document.getElementById(`sector${sectorId}`);
            el.classList.add('hit');
            setTimeout(() => el.classList.remove('hit'), 300);

            // Nota: esta acción es local (simula). Si quieres enviar este evento
            // al ESP32 o a servidor, podemos publicar en otro tópico; por ahora
            // mantengo la sincronía con los datos reales que provienen del ESP32.
        }

        function recordMiss() {
            if (!state.isTraining) return;
            state.shots++;
            updateStatsUI();
            // también podríamos publicar un evento 'fallo' si lo necesitás
        }

        // Auto-conectar al cargar la página
        window.addEventListener('load', () => {
            connectMQTT();
        });

        // Clean disconnect on unload
        window.addEventListener('beforeunload', () => {
            if (client) client.end();
        });
    </script>
</body>
</html>
